<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: aquamarine(5,26,61) 
        }
        form {
            width: 370px;
            height: 250px;
            padding: 10px;
            border-radius: 20px;
            background-color: #053570;
            box-shadow: 1px 1px 1px rgb(230, 225, 227);
            
        }
        .formcontroller {
            padding: 10px;
        }
        input {
            width: 250px;
            height: 50px;
            border-radius: 10px;
        }
        label {
            font-size: large;
            width: 80px;
            display: inline-block;
            color: white;
        }
        button {
            padding: 10px 150px;
            background-color: white(230 ,225 ,227);
            color: black;
            border-radius: 10px;
            align-items: center;
        }
       
 
    </style>
    
</head>
<body>
    <form action="">
        <div class="formcontroller">
            <label for="">username</label>
            <input type="text" id="username" placeholder="put username " name="username" >
        </div>
        <div  class="formcontroller">
            <label for="password">password

            </label>
            <input type="password" placeholder="put password" id="password">
            
        </div>
        <div class="formcontroller">
            <button class="submit"> LOGIN</button>
            
        </div>

    </form>
    
</body>
</html>
